<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设备诊断原型 · 智能诊断</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css" />
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue/dist/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
  <style>
    :root {
      --defaultColor: #4A80F7;
      --defaultColorLight: #ECF2FF;
      --defaultColorLighter: #F0F5FF;
      --successColor: #52C41A;
      --warningColor: #FAAD14;
      --dangerColor: #FF4D4F;
      --fontTitle: #1A2035;
      --fontDefault: #334060;
      --fontNormal: #8A93A8;
      --fontInfo: #B8C0CF;
      --borderBase: #E4E9F2;
      --borderHover: #C5CEDF;
      --bgColor: #EFF2F8;
      --bgCard: #FFFFFF;
      --bgHover: #F6F8FC;
      --shadowSm: 0 1px 4px rgba(26,32,64,0.06);
      --shadowMd: 0 2px 10px rgba(26,32,64,0.08);
      --radiusSm: 4px;
      --radiusMd: 6px;
      --radiusFull: 9999px;
      --sidebarBg: #1C2438;
      --sidebarText: #96A3BC;
      --sidebarActiveText: #FFFFFF;
      --sidebarActive: rgba(74,128,247,0.20);
      --sidebarActiveBar: #4A80F7;
      --sidebarHover: rgba(255,255,255,0.07);
      --sidebarIconColor: #6A7A9A;
      --el-color-primary: #4A80F7;
      --el-color-primary-light-9: #ecf2ff;
      --el-color-primary-dark-2: #3a6fe8;
      --el-color-success: #52C41A;
      --el-color-warning: #FAAD14;
      --el-color-danger: #FF4D4F;
      --el-border-color: #E4E9F2;
      --el-fill-color-light: #F6F8FC;
      --el-text-color-primary: #334060;
      --el-text-color-regular: #334060;
      --el-text-color-secondary: #8A93A8;
      --el-bg-color: #FFFFFF;
      --el-border-radius-base: 4px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px; background: var(--bgColor); color: var(--fontDefault); min-height: 100vh;
    }
    .proto-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: #1d3557; padding: 4px 16px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; color: rgba(255,255,255,0.6);
    }
    .proto-bar strong { color: #fff; margin-right: 6px; }
    .proto-badge {
      background: rgba(255,178,0,0.15); border: 1px solid rgba(255,178,0,0.4);
      color: #ffc107; padding: 1px 9px; border-radius: 20px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
    }
    /* ===== 整体布局 ===== */
    .portal-wrap { display: flex; flex-direction: column; height: 100vh; padding-top: 26px; }

    /* ===== 顶部 Header — 蓝紫渐变（对齐图2真实项目）===== */
    .p-header {
      position: relative; width: 100%; height: 60px;
      background: linear-gradient(90deg, #4158D0 0%, #5B6FE8 50%, #4A80F7 100%);
      box-shadow: 0 2px 12px rgba(65,88,208,0.35);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; z-index: 100;
    }
    .p-header::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.25) 50%, transparent 100%);
      pointer-events: none;
    }
    .p-header-logo {
      padding: 0 16px 0 20px; cursor: pointer; display: flex; align-items: center; opacity: 0.95;
    }
    .p-header-logo-inner { display: flex; align-items: center; gap: 10px; }
    .p-header-logo-mark {
      width: 32px; height: 32px; background: rgba(255,255,255,0.22); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .p-header-logo-text { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .p-header-right {
      padding-right: 28px; display: flex; align-items: center; height: 60px; gap: 4px;
    }
    .p-header-hint { font-size: 11px; color: rgba(255,255,255,0.5); margin-right: 12px; font-style: italic; }
    .p-header-icon-btn {
      width: 32px; height: 32px; border-radius: var(--radiusFull);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.85); cursor: pointer; font-size: 16px;
      transition: background-color 0.2s ease;
    }
    .p-header-icon-btn:hover { background-color: rgba(255,255,255,0.15); color: #fff; }
    .p-header-avatar {
      width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.22);
      border: 2px solid rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
      margin: 0 6px 0 10px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .p-header-avatar:hover { border-color: rgba(255,255,255,0.9); box-shadow: 0 0 0 3px rgba(255,255,255,0.15); transform: scale(1.06); }
    .p-header-username {
      color: rgba(255,255,255,0.9); cursor: pointer; font-size: 14px; font-weight: 500;
      display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 20px;
      transition: background-color 0.2s ease;
    }
    .p-header-username:hover { background-color: rgba(255,255,255,0.15); color: #fff; }

    /* ===== 主体区 aside + main ===== */
    .p-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }

    /* ===== 侧边栏 — 白色底（对齐图2真实项目）===== */
    .p-aside {
      width: 174px; flex-shrink: 0;
      background-color: #fff;
      border-right: 1px solid var(--borderBase);
      box-shadow: 2px 0 8px rgba(0,0,0,0.04);
      height: 100%; overflow-y: auto; overflow-x: hidden;
      display: flex; flex-direction: column;
    }
    /* 折叠/展开按钮 */
    .p-collapse-btn {
      display: flex; align-items: center; justify-content: flex-end;
      padding: 8px 14px; cursor: pointer;
      border-bottom: 1px solid var(--borderBase); flex-shrink: 0;
      transition: background-color 0.2s ease; color: var(--fontNormal); font-size: 16px;
    }
    .p-collapse-btn:hover { background-color: var(--bgHover); color: var(--defaultColor); }
    /* 菜单项（白色底风格）*/
    .p-menu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px; height: 46px;
      font-size: 13px; cursor: pointer; color: var(--fontNormal);
      border-left: 3px solid transparent;
      transition: background-color 0.18s ease, color 0.18s ease;
    }
    .p-menu-item:hover { background-color: var(--defaultColorLighter); color: var(--defaultColor); }
    .p-menu-item:hover .p-menu-icon { color: var(--defaultColor); }
    .p-menu-item.active {
      background-color: var(--defaultColorLighter); color: var(--defaultColor);
      border-left-color: var(--defaultColor); font-weight: 600;
    }
    .p-menu-item.active .p-menu-icon { color: var(--defaultColor); }
    .p-menu-icon { font-size: 15px; color: var(--fontNormal); flex-shrink: 0; }

    /* ===== el-main ===== */
    .p-main {
      flex: 1; min-width: 0; overflow-y: auto;
      padding: 10px 16px 0 16px;
      background-color: var(--bgColor);
    }
    .main-container { padding: 4px 0 0 0; }
    .content-container { margin-top: 12px; }
    .msg_title {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 600; color: var(--fontTitle); margin: 0; padding: 0;
    }
    .msg_title i {
      display: inline-block; width: 3px; height: 14px;
      background: var(--defaultColor); border-radius: 2px; flex-shrink: 0;
    }
    .msg_title b { font-weight: 600; font-style: normal; }
    .card-diagnose-box {
      background: var(--bgCard); border: 1px solid var(--borderBase);
      border-radius: var(--radiusMd); box-shadow: var(--shadowSm);
      overflow: hidden; transition: box-shadow 0.2s ease; height: 100%;
    }
    .card-diagnose-box:hover { box-shadow: var(--shadowMd); }
    .card-diagnose-box > div:first-child {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; background: var(--bgHover); border-bottom: 1px solid var(--borderBase);
    }
    .card-diagnose-box > div:first-child .msg_title { flex: 1; }
    .card-diagnose-box .box-border { padding: 14px 16px; }
    .card-diagnose-box .content { display: inline-block; margin-right: 6px; font-size: 13px; }
    .card-diagnose-box .green { font-weight: 600; color: var(--successColor); }
    .card-diagnose-box .red   { font-weight: 600; color: var(--dangerColor); }
    .card-diagnose-box .gray  { color: var(--fontNormal); }
    .card-diagnose-box .desc-btn, .card-diagnose-box .desc-long-btn {
      height: 22px; padding: 0 8px; font-size: 12px; border-radius: var(--radiusSm); vertical-align: middle;
    }
    .basic-info-container {
      background: var(--bgCard); border: 1px solid var(--borderBase);
      border-radius: var(--radiusMd); box-shadow: var(--shadowSm);
      overflow: hidden; transition: box-shadow 0.2s ease;
    }
    .basic-info-container:hover { box-shadow: var(--shadowMd); }
    .basic-info-container > .msg_title {
      display: flex; align-items: center;
      padding: 10px 16px; background: var(--bgHover); border-bottom: 1px solid var(--borderBase);
      justify-content: space-between;
    }
    .basic-info-container .box-border { padding: 14px 16px; }
    .basic-info-container .green { font-weight: 600; color: var(--successColor); }
    .basic-info-container .red   { font-weight: 600; color: var(--dangerColor); }
    .basic-info-container .gray  { color: var(--fontNormal); }
    .flex-container { display: flex; width: 100%; gap: 16px; }
    .flex-item { display: flex; flex-direction: column; gap: 16px; }
    .flex-left { flex: 7 !important; min-width: 0; }
    .flex-left-top {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px; padding: 10px 16px;
      background: var(--bgCard); border: 1px solid var(--borderBase);
      border-radius: var(--radiusMd); box-shadow: var(--shadowSm);
    }
    .flex-left-top__actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    /* 搜索框（对齐 index.vue 入口页样式）*/
    .diagnose-search-input {
      width: 340px;
    }
    .diagnose-search-input .el-input__wrapper {
      border-radius: 8px 0 0 8px !important;
      box-shadow: none !important;
      border: 1px solid var(--borderBase) !important;
    }
    .diagnose-search-input .el-input-group__append {
      border-radius: 0 8px 8px 0 !important;
      border: 1px solid var(--borderBase) !important;
      border-left: none !important;
      padding: 0 16px;
    }
    .diagnose-search-input .el-input-group__append .el-button {
      padding: 0 16px;
      border-radius: 0 8px 8px 0;
    }
    .flex-tabs-card {
      background: var(--bgCard); border: 1px solid var(--borderBase);
      border-radius: var(--radiusMd); box-shadow: var(--shadowSm); padding: 0 16px;
    }
    .flex-tabs-card .el-tabs__header { margin-bottom: 0; }
    .flex-tabs-card .el-tabs__nav-wrap::after { height: 1px; background: var(--borderBase); }
    .flex-row-item { display: flex; flex-wrap: wrap; gap: 16px; }
    .flex-row-item .row-item { width: calc(50% - 8px); }
    .flex-row-item .row-item--full { width: 100%; }
    .flex-right { flex: 3 !important; min-width: 0; position: sticky; top: 0; align-self: flex-start; }
    .diagnose-card-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px 4px 10px;
      background: var(--defaultColorLighter); border: 1px solid var(--defaultColorLight);
      border-radius: var(--radiusFull); margin-right: 12px;
    }
    .diagnose-card-badge__icon { font-size: 14px; color: var(--defaultColor); }
    .diagnose-card-badge__text {
      font-size: 13px; font-weight: 600; color: var(--defaultColor);
      letter-spacing: 0.3px; font-family: 'Courier New', monospace;
    }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .row-item--animated { animation: fadeInUp 0.32s ease both; animation-delay: var(--delay, 0s); }
    .qr-preview-card {
      background: var(--bgCard); border: 1px solid var(--borderBase);
      border-radius: var(--radiusMd); box-shadow: var(--shadowSm); overflow: hidden;
    }
    .qr-preview-card__header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: var(--bgHover); border-bottom: 1px solid var(--borderBase);
    }
    .qr-preview-card__actions { display: flex; gap: 8px; }
    .qr-preview-card__body { padding: 20px 16px; min-height: 180px; display: flex; align-items: center; justify-content: center; }
    .qr-code-container { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .qr-code-tip { font-size: 12px; color: var(--fontInfo); text-align: center; margin: 0; }
    .qr-placeholder { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px; }
    .qr-placeholder__icon { font-size: 44px; color: var(--borderHover); }
    .qr-placeholder__text { font-size: 13px; color: var(--fontInfo); margin: 0; }
    .qr-scale-enter-active { transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.34,1.36,0.64,1); }
    .qr-scale-leave-active { transition: opacity 0.15s ease; }
    .qr-scale-enter-from { opacity:0; transform:scale(0.88); }
    .qr-scale-leave-to { opacity:0; }
    .section-title {
      font-size: 13px; font-weight: 600; color: var(--fontTitle);
      margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    }
    .section-title::before {
      content: ''; display: inline-block; width: 3px; height: 13px;
      background: var(--defaultColor); border-radius: 2px; flex-shrink: 0;
    }
    .dialog-section { margin-bottom: 20px; }
    .dialog-section:last-child { margin-bottom: 0; }
    .table-scroll { overflow-x: auto; }
    .pager-row { margin-top: 10px; display: flex; justify-content: flex-end; }

    /* ===== 客诉工单创建页（还原 CreateComplains/index.vue 结构）===== */
    .create-complains-form {
      width: 100%;
    }
    .create-complains-form .el-select,
    .create-complains-form .el-input:not(.super-input):not(.small-size-input) {
      width: 280px;
    }
    .has-action-container {
      max-height: calc(100vh - 232px);
      overflow-y: auto;
      padding-bottom: 80px;
    }
    .form-section {
      margin-bottom: 16px;
      padding: 0 20px 20px;
      background: var(--bgCard);
      border: 1px solid var(--borderBase);
      border-radius: var(--radiusMd);
      box-shadow: var(--shadowSm);
    }
    .form-section__title {
      font-size: 14px; font-weight: 600; color: var(--fontTitle);
      padding: 12px 20px; margin: 0 -20px 16px;
      background: linear-gradient(90deg, rgba(74,128,247,0.06) 0%, transparent 100%);
      border-bottom: 1px solid var(--borderBase);
      display: flex; align-items: center;
    }
    .form-section__title::before {
      content: ''; display: inline-block; width: 3px; height: 14px;
      background: var(--defaultColor); border-radius: 2px; margin-right: 8px; flex-shrink: 0;
    }
    .card-verify-result {
      margin: 0 0 16px; padding: 12px 16px 6px;
      border: 1px solid rgba(74,128,247,0.25);
      border-left: 3px solid var(--defaultColor);
      border-radius: 0 var(--radiusSm) var(--radiusSm) 0;
      background: rgba(74,128,247,0.04);
      margin-left: 140px;
    }
    .card-verify-result__header {
      font-size: 13px; font-weight: 600; color: var(--fontTitle);
      display: flex; align-items: center; gap: 8px;
      padding-bottom: 8px; margin-bottom: 6px;
      border-bottom: 1px dashed var(--borderBase);
    }
    .card-verify-result__grid {
      display: grid; grid-template-columns: 1fr; gap: 0 4px; align-items: start;
    }
    @media (min-width: 720px) {
      .card-verify-result__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 1200px) {
      .card-verify-result__grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .card-verify-result .el-form-item { margin-bottom: 8px; }
    .inline-field { display: flex; align-items: center; gap: 8px; }
    .super-input { width: 100%; }
    .small-size-input { width: 120px; }
    .continue-add-check { margin-left: 24px; }
    .avatar-uploader-icon-btn {
      width: 88px; height: 88px; border-radius: var(--radiusMd);
      border: 1px dashed var(--borderHover); background: var(--bgHover);
      font-size: 20px; color: var(--fontNormal);
    }
    .el-breadcrumb__item .el-breadcrumb__inner,
    .el-breadcrumb__item .el-breadcrumb__inner a { color: var(--fontNormal) !important; font-size: 13px; }
    .el-breadcrumb__item:last-child .el-breadcrumb__inner { color: var(--fontDefault) !important; }
    .el-dialog__header { padding: 14px 18px 12px; border-bottom: 1px solid var(--borderBase); }
    .el-dialog__title { font-size: 14px; font-weight: 600; color: var(--fontTitle); }
    .el-dialog__body { padding: 16px 18px; }
    .el-tabs__content { padding-top: 12px; }
    .el-descriptions__label  { color: var(--fontNormal)  !important; font-size: 13px !important; }
    .el-descriptions__content{ color: var(--fontDefault) !important; font-size: 13px !important; }
    /* 表格样式统一 */
    .el-table th.el-table__cell {
      background-color: #f5f7fa !important;
      color: var(--fontNormal) !important;
      font-weight: normal !important;
      font-size: 12px !important;
    }
    .el-table td.el-table__cell { font-size: 13px; color: var(--fontDefault); }
    .el-table .cell { white-space: nowrap; }
  </style>
</head>
<body>

<div class="proto-bar">
  <div><strong>客诉平台原型 v1.1</strong>仅用于产品评审与需求核对，不代表最终实现。左侧菜单可切换「智能诊断 / 客诉工单创建（开票） / 面包退款」三个模块。</div>
  <span class="proto-badge">PROTOTYPE · v1.1</span>
</div>

<div id="app">
  <div class="portal-wrap">

    <!-- Header（还原 Header.vue 真实结构）-->
    <header class="p-header">
      <div class="p-header-logo">
        <div class="p-header-logo-inner">
          <div class="p-header-logo-mark">客</div>
          <span class="p-header-logo-text">客诉系统</span>
        </div>
      </div>
      <div class="p-header-right">
        <span class="p-header-hint" v-if="currentPage === 'diagnose'">← 搜索框输入设备号 DV250703001 后跳转至此页（原型模拟）</span>
        <!-- 主题切换 -->
        <div class="p-header-icon-btn" title="切换主题">☀</div>
        <!-- 全屏 -->
        <div class="p-header-icon-btn" title="全屏">⛶</div>
        <!-- 用户头像 -->
        <div class="p-header-avatar">刘</div>
        <!-- 用户名下拉 -->
        <div class="p-header-username">刘强东 ▾</div>
      </div>
    </header>

    <div class="p-body">

      <!-- 侧边栏（还原 el-aside + Sidebar.vue）-->
      <aside class="p-aside">
        <!-- 折叠/展开按钮（collapse-btn-wrapper）-->
        <div class="p-collapse-btn">☰</div>
        <!-- 菜单 -->
        <div class="p-menu-item" :class="{ active: currentPage === 'diagnose' }" @click="currentPage = 'diagnose'">
          <span class="p-menu-icon">🔍</span>
          智能诊断
        </div>
        <div class="p-menu-item" :class="{ active: currentPage === 'complain' }" @click="currentPage = 'complain'">
          <span class="p-menu-icon">🧾</span>
          客诉工单创建
        </div>
        <div class="p-menu-item" :class="{ active: currentPage === 'refund' }" @click="currentPage = 'refund'">
          <span class="p-menu-icon">💰</span>
          面包退款
        </div>
      </aside>

      <!-- 主内容区（el-main）-->
      <main class="p-main">
        <div class="main-container">
        <template v-if="currentPage === 'diagnose'">
        <el-breadcrumb separator="/">
          <el-breadcrumb-item><span style="cursor:pointer;">智能诊断</span></el-breadcrumb-item>
          <el-breadcrumb-item>诊断详情</el-breadcrumb-item>
        </el-breadcrumb>

        <div class="content-container">
          <div class="flex-container">

            <!-- 左栏 -->
            <div class="flex-item flex-left">

              <!-- 操作栏 -->
              <div class="flex-left-top">
                <div class="diagnose-card-badge">
                  <el-icon class="diagnose-card-badge__icon"><cpu></cpu></el-icon>
                  <span class="diagnose-card-badge__text">{{ device.deviceNo }}</span>
                </div>
                <div class="flex-left-top__actions">
                  <!-- 搜索框：靠右，查询工单前 -->
                  <el-input
                    v-model="searchCardNum"
                    clearable
                    placeholder="请输入 ICCID / 卡号 / 虚拟卡号 / 多网卡号"
                    class="diagnose-search-input"
                    @keyup.enter="onSearchConfirm"
                  >
                    <template #append>
                      <el-button @click="onSearchConfirm">诊断</el-button>
                    </template>
                  </el-input>

<script>
const { createApp, ref, reactive, computed } = Vue;

const app = createApp({
  setup() {
    const mainTab     = ref('device');
    const cardTab     = ref('telecom');
    const qrVisible   = ref(false);
    const cardLogTab  = ref('deviceOp');
    const mealMoreTab = ref('mealInfo');
    const selectedChannel = ref(null);
    const searchCardNum = ref('');
    const onSearchConfirm = () => {
      const num = searchCardNum.value.trim();
      if (!num) { ElementPlus.ElMessage.warning('请输入卡号或设备号'); return; }
      ElementPlus.ElMessage.success(`正在跳转查询：${num}（原型模拟）`);
      searchCardNum.value = '';
    };
    const dialogs = reactive({ channel:false, deviceDetail:false, cardLog:false, mealMore:false, complainLog:false });

    // ============ 页面切换（智能诊断 / 客诉工单创建 / 面包退款） ============
    const currentPage = ref('diagnose');

    // 通用：是否超过一年（与 CreatePine 现有 isYearPassed 逻辑保持一致）
    const isYearPassed = date => {
      if (date) {
        const oneYearAgo = new Date();
        oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
        return new Date(date).getTime() <= oneYearAgo.getTime();
      }
      return false;
    };

    const followerOpts = ref([
      { userid: 'u1', name: '张三三' },
      { userid: 'u2', name: '李四四' },
      { userid: 'u3', name: '王五五' },
    ]);

    // ============ 页面2：客诉工单创建（新增"开票"业务类型） ============
    const complainBusinessOpts = ref([
      { value: 'CONSULT', label: '业务咨询' },
      { value: 'COMPLAIN', label: '投诉工单' },
      { value: 'FAULT', label: '故障工单' },
      { value: 'INVOICE', label: '开票' },
    ]);
    const complainForm = reactive({
      customerIndustryCategory: 'C',
      channel: null,
      business: 'INVOICE',
      subBusiness: '',
      faultOrderId: '',
      follow: false,
      followId: '',
      doubleCheck: false,
      content: '',
      wechatGroupId: '',
      handleTime: '',
      targetType: 'PINE_CODE',
      uploadType: 'SINGLE',
      targetId: '',
      device: '',
    });
    const onCheckCard = () => {
      if (!complainForm.targetId) { ElementPlus.ElMessage.warning('请输入卡号'); return; }
      ElementPlus.ElMessage.success('校验通过（原型模拟）');
    };

    // 开票信息表单
    const invoiceForm = reactive({
      orderList: [],
      cardIds: [],
      title: '',
      mergeInvoice: true,
      amount: 0,
      count: 1,
      remark: '',
      phone: '',
      email: '',
    });
    const onMergeInvoiceChange = () => {
      invoiceForm.count = invoiceForm.mergeInvoice ? 1 : invoiceForm.orderList.length;
    };

    // 可开票订单模拟数据池：一年内可开票订单 + 已开票（不可再选）+ 超一年（不展示，演示过滤）
    const invoiceOrderPool = ref([
      { cardId: '8986112320809379437', orderId: 'PN20260520000123', status: '已支付', fee: 9.9,  serviceName: '10GB月流量包',  paysuccessTime: '2026-05-20', invoiced: false },
      { cardId: '8986112320809379438', orderId: 'PN20260318000456', status: '已支付', fee: 19.9, serviceName: '20GB季度流量包', paysuccessTime: '2026-03-18', invoiced: false },
      { cardId: '8986112320809379438', orderId: 'PN20260110000789', status: '已支付', fee: 29.9, serviceName: '50GB半年流量包', paysuccessTime: '2026-01-10', invoiced: false },
      { cardId: '8986112320809379440', orderId: 'PN20251215000234', status: '已支付', fee: 11.5, serviceName: '10GB月流量包',  paysuccessTime: '2025-12-15', invoiced: false },
      { cardId: '8986112320809379440', orderId: 'PN20251008000567', status: '已支付', fee: 15.0, serviceName: '10GB月流量包',  paysuccessTime: '2025-10-08', invoiced: true },
      { cardId: '8986112320809379439', orderId: 'PN20250310000999', status: '已支付', fee: 59.0, serviceName: '100GB年流量包', paysuccessTime: '2025-03-10', invoiced: false },
    ]);

    const invoiceDialog = reactive({
      visible: false,
      queryType: 'cardId',
      queryValue: '8986112320809379437',
      tableData: [],
      multipleSelection: [],
    });
    const invoiceAddedOrderIds = computed(() => invoiceForm.orderList.map(r => r.orderId));
    window.__debug = { invoiceForm, invoiceDialog };

    const onQueryInvoiceOrders = () => {
      const keyword = invoiceDialog.queryValue.trim();
      if (!keyword) {
        ElementPlus.ElMessage.warning(invoiceDialog.queryType === 'orderId' ? '请输入订单号' : '请输入物联网卡号');
        invoiceDialog.tableData = [];
        return;
      }
      // 按物联网卡号查询：仅支持查询一张卡的可开票订单；按订单号查询：精确匹配该笔订单
      // 均仅展示一年内的订单
      invoiceDialog.tableData = invoiceOrderPool.value.filter(o => {
        const matched = invoiceDialog.queryType === 'orderId' ? o.orderId === keyword : o.cardId === keyword;
        return matched && !isYearPassed(o.paysuccessTime);
      });
    };
    const onInvoiceSelectionChange = rows => { invoiceDialog.multipleSelection = rows; };
    const onChooseInvoiceOrder = () => {
      invoiceDialog.multipleSelection = [];
      onQueryInvoiceOrders();
      invoiceDialog.visible = true;
    };
    const recalcInvoiceFromOrders = () => {
      invoiceForm.cardIds = [...new Set(invoiceForm.orderList.map(r => r.cardId))];
      invoiceForm.amount = +invoiceForm.orderList.reduce((sum, r) => sum + r.fee, 0).toFixed(2);
      invoiceForm.count = invoiceForm.mergeInvoice ? 1 : invoiceForm.orderList.length;
    };
    const onConfirmInvoiceOrders = () => {
      const rows = invoiceDialog.multipleSelection;
      if (!rows.length) { ElementPlus.ElMessage.warning('请至少选择一笔订单'); return; }
      const existingIds = new Set(invoiceForm.orderList.map(r => r.orderId));
      const newRows = rows.filter(r => !existingIds.has(r.orderId)).map(r => ({ ...r }));
      invoiceForm.orderList = [...invoiceForm.orderList, ...newRows];
      recalcInvoiceFromOrders();
      if (!invoiceForm.title) invoiceForm.title = '杜建钊';
      if (!invoiceForm.phone) invoiceForm.phone = '13297223227';
      if (!invoiceForm.email) invoiceForm.email = '812705432@qq.com';
      invoiceDialog.visible = false;
    };
    const onRemoveInvoiceOrder = row => {
      invoiceForm.orderList = invoiceForm.orderList.filter(r => r.orderId !== row.orderId);
      recalcInvoiceFromOrders();
    };
    const onComplainSubmit = () => {
      if (complainForm.business === 'INVOICE' && !invoiceForm.orderList.length) {
        ElementPlus.ElMessage.warning('请先选择开票订单');
        return;
      }
      ElementPlus.ElMessage.success('工单创建成功（原型模拟）');
    };

    // ============ 页面3：面包退款（线下退款新增"收款账号"必填项） ============
    const refundForm = reactive({ orderList: [], followId: '' });
    const refundActiveNames = ref([]);
    const refundOrderPool = ref([
      { orderId: 'PN20260520000123', status: '已支付', fee: 39.9, serviceName: '20GB季度流量包', paysuccessTime: '2026-05-20' },
      { orderId: 'PN20260212000456', status: '已支付', fee: 19.9, serviceName: '10GB月流量包',  paysuccessTime: '2026-02-12' },
      { orderId: 'PN20250310000789', status: '已支付', fee: 59.0, serviceName: '100GB年流量包', paysuccessTime: '2025-03-10' },
      { orderId: 'PN20241120000234', status: '已支付', fee: 99.0, serviceName: '200GB年流量包', paysuccessTime: '2024-11-20' },
    ]);
    const refundDialog = reactive({ visible: false, tableData: [], multipleSelection: [] });
    const onChooseRefundOrder = () => {
      refundDialog.tableData = refundOrderPool.value;
      refundDialog.visible = true;
    };
    const onRefundSelectionChange = rows => {
      if (rows.length > 5) { ElementPlus.ElMessage.warning('最多可选择5笔订单'); }
      refundDialog.multipleSelection = rows;
    };
    const onConfirmRefundOrders = () => {
      const rows = refundDialog.multipleSelection;
      if (!rows.length) { ElementPlus.ElMessage.warning('请至少选择一笔订单'); return; }
      refundForm.orderList = rows.map(r => ({
        ...r,
        refundAmount: r.fee,
        // 超一年默认线下退款（与退款渠道现有默认值逻辑保持一致，叠加"超一年"判断）
        refundChannel: isYearPassed(r.paysuccessTime) ? 'OFFLINE_PAYMENT' : 'ORIGINAL_REFUND',
        collectionAccount: '',
        refundReason: '',
      }));
      refundActiveNames.value = rows.map(r => r.orderId);
      refundDialog.visible = false;
    };
    const onRefundSubmit = () => {
      const missingAccount = refundForm.orderList.some(o => o.refundChannel === 'OFFLINE_PAYMENT' && !o.collectionAccount);
      if (missingAccount) { ElementPlus.ElMessage.warning('线下退款订单请填写收款账号'); return; }
      ElementPlus.ElMessage.success('工单创建成功（原型模拟）');
    };
